<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0b0d">
<meta name="description" content="PBM Works product detail">
<title>PBM Works</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav><div class="wrap nav-inner"><a class="brand" href="index.html"><span class="mark">PBM</span><span class="wordmark">PBM WORKS<small>DIGITAL GOODS</small></span></a><div class="nav-links"><a href="index.html#works" data-t="works">Works</a><a href="index.html#collections" data-t="collections">Collections</a><a href="index.html#approach" data-t="approach">Approach</a></div><div class="lang"><button data-lang="en">EN</button><button data-lang="de">DE</button><button data-lang="bg">BG</button></div></div></nav>
<main class="product-page"><div class="wrap"><a class="back" href="index.html#works">←&nbsp; <span data-t="back">Back to works</span></a><div id="detail"></div></div></main>
<footer><div class="wrap footer-row"><div><div class="footer-brand">PBM WORKS</div><div style="font-size:10px;margin-top:4px">PRACTICAL DIGITAL PRODUCTS, THOUGHTFULLY BUILT.</div></div><div class="footer-copy" data-t="footer">Independent digital goods.</div></div></footer>
<script src="products.js"></script>
<script>
const T={
 en:{works:'Works',collections:'Collections',approach:'Approach',back:'Back to works',oneTime:'One-time purchase',buy:'Buy MATCHPULSE 10',soon:'Checkout link coming next',includes:'Inside the bundle',offline:'Download once and use the core tools offline. No recurring subscription is required.',fine:'Football analysis involves uncertainty. MATCHPULSE is an analytical toolkit, not a promise of outcomes or betting profit.',footer:'Independent digital goods.'},
 de:{works:'Produkte',collections:'Kollektionen',approach:'Ansatz',back:'Zurück zu den Produkten',oneTime:'Einmaliger Kauf',buy:'MATCHPULSE 10 kaufen',soon:'Checkout-Link folgt als Nächstes',includes:'Im Bundle enthalten',offline:'Einmal herunterladen und die Kern-Tools offline nutzen. Kein wiederkehrendes Abo erforderlich.',fine:'Fußballanalyse ist mit Unsicherheit verbunden. MATCHPULSE ist ein Analyse-Toolkit und kein Versprechen für Ergebnisse oder Wettgewinne.',footer:'Unabhängige digitale Produkte.'},
 bg:{works:'Продукти',collections:'Колекции',approach:'Подход',back:'Назад към продуктите',oneTime:'Еднократна покупка',buy:'Купи MATCHPULSE 10',soon:'Checkout линкът е следващата стъпка',includes:'Какво има в пакета',offline:'Изтегляш веднъж и използваш основните инструменти офлайн. Не се изисква повтарящ се абонамент.',fine:'Футболният анализ съдържа несигурност. MATCHPULSE е аналитичен toolkit, а не обещание за резултати или печалба от залози.',footer:'Независими дигитални продукти.'}
};
let lang=localStorage.getItem('pbm_lang');if(!lang){const l=(navigator.language||'en').toLowerCase();lang=l.startsWith('bg')?'bg':l.startsWith('de')?'de':'en'}
const id=new URLSearchParams(location.search).get('id')||'matchpulse-10';const p=PBM_PRODUCTS.find(x=>x.id===id)||PBM_PRODUCTS[0];
function visual(){return `<div class="mp-shell"><div class="mp-top"><span>MATCHPULSE 10</span><span class="mp-chip">OFFLINE</span></div><div class="mp-row"><span>HOME</span><div class="mp-track"><i style="width:58%"></i></div><b>57.8%</b></div><div class="mp-row"><span>DRAW</span><div class="mp-track"><i style="width:25%"></i></div><b>25.4%</b></div><div class="mp-row"><span>AWAY</span><div class="mp-track"><i style="width:17%"></i></div><b>16.8%</b></div><div class="mp-mini"><div><b>2.54</b><small>EXPECTED GOALS</small></div><div><b>46.7%</b><small>OVER 2.5</small></div><div><b>1X 83.2%</b><small>DOUBLE CHANCE</small></div></div></div>`}
function render(){
 document.documentElement.lang=lang;document.title=`${p.title} | PBM Works`;
 document.querySelectorAll('[data-t]').forEach(el=>{const k=el.dataset.t;if(T[lang][k])el.textContent=T[lang][k]});
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
 const cta=p.checkout?`<a class="btn primary" href="${p.checkout}">${T[lang].buy}</a>`:`<button class="btn primary disabled" disabled>${T[lang].soon}</button>`;
 document.getElementById('detail').innerHTML=`<div class="detail"><div class="detail-visual">${visual()}</div><div class="detail-info"><div class="detail-category">${p.categoryLabel[lang]} / PBM WORKS</div><h1>${p.title}</h1><p class="detail-sub">${p.copy[lang]}</p><div class="purchase-row"><div class="purchase-price"><small>${T[lang].oneTime}</small>${p.price}</div>${cta}</div><ul class="feature-list">${p.features[lang].map(f=>`<li>${f}</li>`).join('')}</ul><div class="note">${T[lang].offline}</div><h2>${T[lang].includes}</h2><div class="package">${p.package[lang].map(x=>`<div class="package-item"><b>${x[0]}</b><small>${x[1]}</small></div>`).join('')}</div><p class="fine">${T[lang].fine}</p></div></div>`;
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('pbm_lang',lang);render()});render();
</script>
</body></html>
